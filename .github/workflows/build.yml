name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GOTELEMETRY: 'off'
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: clash-traffic-monitor-windows-x64
          if-no-files-found: error
          path: |
            clash-traffic-monitor.exe
            config.example.json
            README.md
            LICENSE
